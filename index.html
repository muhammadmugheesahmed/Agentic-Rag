<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gemini Agentic RAG Chatbot</title>
  <style>
    :root {
      --bg: #0b0f19;
      --surface: #111827;
      --surface-light: #1f2937;
      --border: #273244;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --user-bubble: #4f46e5;
      --bot-bubble: #182032;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app-container {
      width: 100%;
      max-width: 860px;
      height: 92vh;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }

    .header {
      padding: 18px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(17, 24, 39, 0.9);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      background: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 8px #22c55e;
    }

    .header h1 {
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .header span {
      font-size: 0.78rem;
      color: var(--text-muted);
      background: var(--surface-light);
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
    }

    .chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    .message-wrapper {
      display: flex;
      flex-direction: column;
      max-width: 80%;
    }

    .message-wrapper.user {
      align-self: flex-end;
      align-items: flex-end;
    }

    .message-wrapper.bot {
      align-self: flex-start;
      align-items: flex-start;
    }

    .bubble {
      padding: 13px 17px;
      border-radius: 14px;
      line-height: 1.55;
      font-size: 0.95rem;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .user .bubble {
      background: var(--user-bubble);
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }

    .bot .bubble {
      background: var(--bot-bubble);
      border: 1px solid var(--border);
      color: var(--text);
      border-bottom-left-radius: 4px;
    }

    .steps-container {
      margin-top: 6px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .step-badge {
      font-size: 0.72rem;
      color: var(--text-muted);
      background: rgba(99, 102, 241, 0.12);
      border: 1px solid rgba(99, 102, 241, 0.25);
      padding: 3px 8px;
      border-radius: 6px;
    }

    .typing {
      display: inline-flex;
      gap: 5px;
      padding: 14px 18px;
      background: var(--bot-bubble);
      border: 1px solid var(--border);
      border-radius: 14px;
      border-bottom-left-radius: 4px;
    }

    .typing span {
      width: 7px;
      height: 7px;
      background: var(--text-muted);
      border-radius: 50%;
      animation: bounce 1.2s infinite ease-in-out;
    }

    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }

    .input-area {
      padding: 16px 20px;
      border-top: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .input-area input {
      flex: 1;
      background: var(--surface-light);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 13px 16px;
      border-radius: 12px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-area input:focus {
      border-color: var(--accent);
    }

    .input-area button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 13px 22px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .input-area button:hover {
      background: var(--accent-hover);
    }

    .input-area button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="header">
      <div class="header-left">
        <div class="status-dot"></div>
        <h1>PDF Agentic RAG</h1>
      </div>
      <span>Gemini 2.5 Flash • docs/</span>
    </div>

    <div class="chat-box" id="chatBox">
      <div class="message-wrapper bot">
        <div class="bubble">Hello! I've indexed the PDF(s) in your <strong>docs/</strong> folder. Ask me anything about them.</div>
      </div>
    </div>

    <form class="input-area" id="chatForm">
      <input
        type="text"
        id="userInput"
        placeholder="Ask a question about your PDF..."
        autocomplete="off"
        required
      />
      <button type="submit" id="sendBtn">Send</button>
    </form>
  </div>

  <script>
    const chatBox = document.getElementById("chatBox");
    const chatForm = document.getElementById("chatForm");
    const userInput = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");

    function appendMessage(text, sender, steps = []) {
      const wrapper = document.createElement("div");
      wrapper.className = `message-wrapper ${sender}`;

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;
      wrapper.appendChild(bubble);

      if (steps.length > 0) {
        const stepsDiv = document.createElement("div");
        stepsDiv.className = "steps-container";
        steps.forEach(step => {
          const badge = document.createElement("span");
          badge.className = "step-badge";
          badge.textContent = step;
          stepsDiv.appendChild(badge);
        });
        wrapper.appendChild(stepsDiv);
      }

      chatBox.appendChild(wrapper);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function showTyping() {
      const wrapper = document.createElement("div");
      wrapper.className = "message-wrapper bot";
      wrapper.id = "typingIndicator";
      wrapper.innerHTML = `<div class="typing"><span></span><span></span><span></span></div>`;
      chatBox.appendChild(wrapper);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function removeTyping() {
      const el = document.getElementById("typingIndicator");
      if (el) el.remove();
    }

    chatForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const message = userInput.value.trim();
      if (!message) return;

      appendMessage(message, "user");
      userInput.value = "";
      userInput.disabled = true;
      sendBtn.disabled = true;
      showTyping();

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message })
        });

        const data = await res.json();
        removeTyping();

        if (!res.ok) {
          appendMessage(`Error: ${data.detail || "Something went wrong."}`, "bot");
        } else {
          appendMessage(data.answer, "bot", data.steps || []);
        }
      } catch (err) {
        removeTyping();
        appendMessage("Error: Could not reach the backend server.", "bot");
      } finally {
        userInput.disabled = false;
        sendBtn.disabled = false;
        userInput.focus();
      }
    });
  </script>
</body>
</html>
